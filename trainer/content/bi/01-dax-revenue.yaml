id: dax-revenue
slug: pervaya-mera-dax-vyruchka
module: bi
track: 1
order: 1
title: Первая мера — выручка
seo_title: "Первая мера DAX в Power BI: SUM — тренажёр в браузере"
check: dax
story: "Перед вами модель продаж: таблица «Продажи» связана со справочниками «Клиенты», «Товары» и «Календарь». Каждая строка продаж — товар в заказе, сумма строки уже посчитана в столбце «Сумма». В матрице пока только города."
goal: "Создайте меру «Выручка» — сумму столбца «Сумма» таблицы «Продажи». Нажмите Enter, чтобы увидеть её в матрице, затем «Проверить»."
measure_name: Выручка
answer: "Выручка = SUM('Продажи'[Сумма])"
alt:
  - "Выручка = SUMX('Продажи'; 'Продажи'[Количество] * 'Продажи'[Цена])"
wrong:
  - "Выручка = SUM('Продажи'[Количество])"
  - "Выручка = COUNTROWS('Продажи')"
visual: { rows: "Клиенты[Город]" }
hint: "SUM принимает ссылку на столбец в виде 'Таблица'[Столбец]. Начните вводить имя таблицы — редактор предложит варианты."
explanation: "Мера считается заново в каждой ячейке матрицы. В строке «Москва» фильтр по городу из «Клиентов» проходит по связи в «Продажи», и SUM складывает только московские строки. В итоговой строке фильтра нет — там сумма по всем."
tip: "В Power BI держите все меры в одной таблице и называйте по-человечески: «Выручка», а не «Сумма Сумма». Автоматические агрегаты из панели полей потом не переиспользуешь в других формулах."
