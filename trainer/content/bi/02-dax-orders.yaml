id: dax-orders
slug: chislo-zakazov-distinctcount
module: bi
track: 1
order: 2
title: Число заказов
seo_title: "DISTINCTCOUNT в DAX: число заказов — тренажёр Power BI"
check: dax
story: "Мера «Выручка» уже есть. Руководитель просит показать, сколько заказов сделали клиенты каждого города. В одном заказе бывает до четырёх товаров, и каждый товар — отдельная строка в «Продажах»."
goal: "Создайте меру «Заказы» — число разных заказов."
measure_name: Заказы
answer: "Заказы = DISTINCTCOUNT('Продажи'[Номер заказа])"
alt:
  - "Заказы = COUNTROWS(VALUES('Продажи'[Номер заказа]))"
  - "Заказы = COUNTROWS(DISTINCT('Продажи'[Номер заказа]))"
wrong:
  - "Заказы = COUNTROWS('Продажи')"
  - "Заказы = COUNT('Продажи'[Номер заказа])"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
visual: { rows: "Клиенты[Город]", values: [Выручка] }
hint: "Строк в «Продажах» больше, чем заказов: один заказ занимает несколько строк. Нужно количество уникальных номеров."
explanation: "COUNTROWS и COUNT считают строки, поэтому заказ из трёх товаров посчитался бы трижды. DISTINCTCOUNT считает разные значения столбца."
tip: "Если цифра в отчёте подозрительно большая, перейдите в представление «Таблица» и отфильтруйте один заказ. Сразу видно, сколько строк он занимает."
