id: dax-avg-check
slug: sredniy-chek-divide
module: bi
track: 1
order: 3
title: Средний чек
seo_title: "DIVIDE в DAX: средний чек — тренажёр Power BI"
check: dax
story: "В модели есть меры «Выручка» и «Заказы». Нужен средний чек по городам: выручка, делённая на число заказов. Если заказов нет, в ячейке должно быть пусто, а не ошибка."
goal: "Создайте меру «Средний чек» из готовых мер."
measure_name: Средний чек
answer: "Средний чек = DIVIDE([Выручка]; [Заказы])"
alt:
  - "Средний чек = [Выручка] / [Заказы]"
  - "Средний чек = DIVIDE(SUM('Продажи'[Сумма]); DISTINCTCOUNT('Продажи'[Номер заказа]))"
wrong:
  - "Средний чек = AVERAGE('Продажи'[Сумма])"
  - "Средний чек = DIVIDE([Выручка]; COUNTROWS('Продажи'))"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
  - "Заказы = DISTINCTCOUNT('Продажи'[Номер заказа])"
visual: { rows: "Клиенты[Город]", values: [Выручка, Заказы] }
hint: "Мера может ссылаться на другие меры по имени в квадратных скобках. DIVIDE(числитель; знаменатель) сам вернёт пусто при делении на ноль."
explanation: "AVERAGE усреднил бы строки заказов, то есть средний товар, а не средний чек. Мера из двух мер считает правильно в любом разрезе: и по городу, и по месяцу."
tip: "DIVIDE лучше оператора «/»: не нужно писать IF для нулевого знаменателя, а третьим аргументом можно задать значение вместо пустоты, например 0."
