id: dax-delivered
slug: calculate-filtr-po-statusu
module: bi
track: 2
order: 4
title: Выручка только доставленных заказов
seo_title: "CALCULATE в DAX: фильтр внутри меры — тренажёр Power BI"
check: dax
story: "В выручку попадают и отменённые заказы, и те, что ещё в пути. Финансовый директор хочет видеть по месяцам только деньги за доставленные заказы, причём без ручного фильтра на странице."
goal: "Создайте меру «Выручка доставленных»: [Выручка] только по строкам со статусом «Доставлен»."
measure_name: Выручка доставленных
answer: "Выручка доставленных = CALCULATE([Выручка]; 'Продажи'[Статус] = \"Доставлен\")"
alt:
  - "Выручка доставленных = CALCULATE(SUM('Продажи'[Сумма]); FILTER(ALL('Продажи'[Статус]); 'Продажи'[Статус] = \"Доставлен\"))"
  - "Выручка доставленных = SUMX(FILTER('Продажи'; 'Продажи'[Статус] = \"Доставлен\"); 'Продажи'[Сумма])"
wrong:
  - "Выручка доставленных = CALCULATE([Выручка]; 'Продажи'[Статус] <> \"Отменён\")"
  - "Выручка доставленных = [Выручка]"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
check_rows: ["Клиенты[Город]", "Товары[Категория]", "Календарь[Месяц]"]
visual: { rows: "Календарь[Месяц]", values: [Выручка] }
hint: "CALCULATE(выражение; условие) считает выражение с дополнительным фильтром. Текст в условии пишется в двойных кавычках."
explanation: "CALCULATE добавляет фильтр по статусу к фильтрам ячейки, поэтому месяц из строки матрицы сохраняется. Если статус задать фильтром визуала, другие меры на странице тоже его получат, а мера с CALCULATE работает сама по себе."
tip: "Поставьте в строки матрицы поле «Статус»: в строках «Отменён» и «В пути» мера всё равно покажет выручку доставленных, потому что CALCULATE заменяет фильтр по статусу. Если нужно пересечение с фильтром отчёта, оберните условие в KEEPFILTERS."
