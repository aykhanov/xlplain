id: calculate-all
slug: calculate-all-kontekst-filtra
module: bi
track: 2
order: 5
title: Мера, которая игнорирует срез по городу
seo_title: "CALCULATE и ALL в DAX: снять фильтр — тест с разбором"
check: choice
story: В отчёте есть срез «Город». Нужна мера, которая всегда показывает выручку по всем городам, что бы ни выбрали в срезе.
goal: Какая мера даст такой результат?
options:
  - text: "CALCULATE([Выручка]; ALL('Клиенты'[Город]))"
    correct: true
    why: ALL снимает фильтр со столбца «Город», остальные фильтры отчёта продолжают работать.
  - text: "SUMX(FILTER('Продажи'; RELATED('Клиенты'[Город]) <> BLANK()); 'Продажи'[Сумма])"
    why: FILTER работает внутри текущего контекста, поэтому срез по городу всё равно применится.
  - text: "CALCULATE([Выручка]; 'Клиенты'[Город] = \"Москва\")"
    why: Эта мера заменяет фильтр города на «Москва» и показывает только её.
  - text: "SUM('Продажи'[Сумма]) * COUNTROWS(ALL('Продажи'))"
    why: Умножение на число строк даёт бессмысленную величину, к выручке по всем городам оно не ведёт.
hint: Подумайте, какая функция убирает фильтр с одного столбца, не трогая остальные.
tip: REMOVEFILTERS — новое имя для ALL внутри CALCULATE. Делает то же самое, но читается понятнее.
