module: bi
track: 2
order: 5
title: Нарастающий итог с начала года
seo_title: "TOTALYTD в DAX: нарастающий итог — тест с разбором"
check: choice
story: "В модели есть таблица дат «Календарь», связанная с продажами. Нужна выручка нарастающим итогом с 1 января."
goal: Какая мера правильная?
options:
  - text: "TOTALYTD([Выручка]; 'Календарь'[Дата])"
    correct: true
    why: TOTALYTD считает меру за период с начала года до текущей даты в контексте и опирается на таблицу дат.
  - text: "SUM('Продажи'[Сумма]) + PREVIOUSYEAR('Календарь'[Дата])"
    why: PREVIOUSYEAR возвращает набор дат, а не число, поэтому складывать их с суммой нельзя.
  - text: "CALCULATE([Выручка]; ALL('Календарь'))"
    why: Это выручка за все даты сразу, без привязки к текущей дате в отчёте.
  - text: "TOTALYTD([Выручка]; 'Продажи'[Дата])"
    why: Функции времени работают надёжно только с отдельной таблицей дат без пропусков. Столбец дат из продаж для этого не годится.
hint: Функции логики времени принимают столбец дат из полной таблицы календаря.
tip: Отметьте таблицу «Календарь» как таблицу дат (Работа с таблицами → Отметить как таблицу дат). Без этого часть функций времени ведёт себя непредсказуемо.
