id: dax-share-city
slug: dolya-goroda-all
module: bi
track: 2
order: 6
title: Доля города в выручке
seo_title: "ALL в DAX: доля от итога — тренажёр Power BI"
check: dax
story: "Нужно понять, какую долю выручки даёт каждый город. Важно, чтобы срезы «Сегмент» и «Месяц» продолжали работать: если выбрать «Опт», доли считаются от оптовой выручки."
goal: "Создайте меру «Доля выручки»: выручка города, делённая на выручку всех городов. Поставьте мере формат «Процент»."
measure_name: Доля выручки
answer: "Доля выручки = DIVIDE([Выручка]; CALCULATE([Выручка]; ALL('Клиенты'[Город])))"
alt:
  - "Доля выручки = DIVIDE([Выручка]; CALCULATE([Выручка]; REMOVEFILTERS('Клиенты'[Город])))"
  - "Доля выручки = VAR все = CALCULATE([Выручка]; ALL('Клиенты'[Город])) RETURN DIVIDE([Выручка]; все)"
wrong:
  - "Доля выручки = DIVIDE([Выручка]; CALCULATE([Выручка]; ALL('Клиенты')))"
  - "Доля выручки = DIVIDE([Выручка]; CALCULATE([Выручка]; ALL('Продажи')))"
  - "Доля выручки = DIVIDE([Выручка]; SUM('Продажи'[Сумма]))"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
format: percent
visual: { rows: "Клиенты[Город]", values: [Выручка] }
slicers: ["Клиенты[Сегмент]", "Календарь[Месяц]"]
hint: "Знаменатель — та же выручка, но без фильтра по городу. ALL('Клиенты'[Город]) внутри CALCULATE снимает фильтр только с этого столбца."
explanation: "ALL('Клиенты') снял бы фильтры со всей таблицы клиентов, включая срез «Сегмент», и доли при выбранном «Опт» перестали бы давать 100 %. Снимайте фильтр ровно с того столбца, который стоит в строках."
tip: "Формат меры задаётся один раз на ленте «Работа с мерами» и действует во всех визуалах. Не умножайте долю на 100 в формуле — сломаете сравнения и итоги."
