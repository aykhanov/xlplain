title: Порядок шагов очистки выгрузки
seo_title: "Power Query: порядок шагов очистки выгрузки из 1С — тест с разбором"
check: order
story: "Выгрузка из 1С: сверху три строки шапки отчёта, потом заголовки столбцов, внизу строка «Итого», а между блоками пустые строки."
goal: Расставьте шаги Power Query в правильном порядке
steps:
  - Удалить первые 3 строки
  - Использовать первую строку в качестве заголовков
  - Удалить пустые строки
  - Отфильтровать строку «Итого»
  - Изменить тип столбца «Дата» на дату
hint: Заголовки можно повысить, только когда они оказались первой строкой. Тип «Дата» ставьте последним, когда в столбце остались одни даты.
explanation: "Если изменить тип до удаления «Итого», в столбце «Дата» появятся ошибки на строке итогов. А если повысить заголовки до удаления шапки, заголовками станут строки отчёта, а не названия столбцов."
tip: Давайте шагам понятные имена (правый клик → Переименовать). Через месяц вы сами скажете себе спасибо.
