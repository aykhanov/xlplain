id: dax-share-selected
slug: allselected-dolya-ot-vybrannogo
module: bi
track: 2
order: 7
title: Доля от выбранных городов
seo_title: "ALLSELECTED в DAX: доля от выбранного в срезе — тренажёр Power BI"
check: dax
story: "Менеджер выбирает в срезе «Город» только те города, которые курирует, и хочет видеть доли внутри своей подборки: в сумме по выбранным городам должно выходить 100 %."
goal: "Создайте меру «Доля в выборке»: выручка города, делённая на выручку городов, выбранных в срезе. Формат — «Процент»."
measure_name: Доля в выборке
answer: "Доля в выборке = DIVIDE([Выручка]; CALCULATE([Выручка]; ALLSELECTED('Клиенты'[Город])))"
alt:
  - "Доля в выборке = DIVIDE([Выручка]; CALCULATE([Выручка]; ALLSELECTED()))"
wrong:
  - "Доля в выборке = DIVIDE([Выручка]; CALCULATE([Выручка]; ALL('Клиенты'[Город])))"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
format: percent
check_rows: ["Клиенты[Город]"]
visual: { rows: "Клиенты[Город]", values: [Выручка] }
slicers: ["Клиенты[Город]", "Клиенты[Сегмент]"]
hint: "ALL снимает фильтр по городу полностью, вместе со срезом. ALLSELECTED снимает только фильтр строки матрицы и оставляет то, что выбрано в срезе."
explanation: "В ячейке «Казань» действуют два фильтра по городу: строка матрицы и срез. ALLSELECTED убирает первый и возвращает второй, поэтому знаменатель — выручка выбранных городов."
tip: "Выберите в срезе два-три города и посмотрите на итог матрицы: у ALLSELECTED он 100 %, у ALL — меньше. Так быстро проверить, какая функция нужна заказчику."
