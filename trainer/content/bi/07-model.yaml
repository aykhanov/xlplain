title: Связь справочника товаров и продаж
seo_title: "Модель данных Power BI: связь «один ко многим» — тест с разбором"
check: choice
story: "В модели две таблицы: «Товары» (каждый товар один раз, ключ — Код товара) и «Продажи» (много строк с кодом товара)."
goal: Какая связь между ними правильная?
options:
  - text: "Один ко многим: «Товары» (1) → «Продажи» (*), фильтр в одном направлении от товаров к продажам"
    correct: true
    why: Это классическая схема «звезда» — справочник фильтрует таблицу фактов. Срез по категории товара отфильтрует продажи.
  - text: "Многие ко многим между «Товары» и «Продажи»"
    why: В справочнике ключ уникален, поэтому связь «многие ко многим» здесь не нужна и только путает модель.
  - text: "Один ко многим: «Продажи» (1) → «Товары» (*)"
    why: Стороной «один» должна быть таблица, где ключ встречается один раз, то есть справочник «Товары».
  - text: "Один ко многим с фильтром в обоих направлениях"
    why: Двунаправленный фильтр без необходимости замедляет модель и даёт неожиданные итоги. Включают его только под конкретную задачу.
hint: Сторона «один» — та, где каждое значение ключа встречается один раз.
tip: Если в справочнике оказались дубли кода, Power BI не даст создать связь «один ко многим». Это быстрый способ найти дубли в справочнике.
