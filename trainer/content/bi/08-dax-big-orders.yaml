id: dax-big-orders
slug: filter-krupnye-zakazy-perehod-konteksta
module: bi
track: 2
order: 8
title: Сколько крупных заказов
seo_title: "FILTER и переход контекста в DAX: крупные заказы — тренажёр Power BI"
check: dax
story: "Отдел продаж считает заказ крупным, если сумма всех его строк — от 10 000 ₽. Нужна мера с количеством таких заказов по городам и месяцам."
goal: "Создайте меру «Крупные заказы»: число заказов, у которых [Выручка] не меньше 10 000."
measure_name: Крупные заказы
answer: "Крупные заказы = COUNTROWS(FILTER(VALUES('Продажи'[Номер заказа]); [Выручка] >= 10000))"
alt:
  - "Крупные заказы = SUMX(VALUES('Продажи'[Номер заказа]); IF([Выручка] >= 10000; 1))"
  - "Крупные заказы = COUNTROWS(FILTER(VALUES('Продажи'[Номер заказа]); CALCULATE(SUM('Продажи'[Сумма])) >= 10000))"
wrong:
  - "Крупные заказы = COUNTROWS(FILTER(VALUES('Продажи'[Номер заказа]); SUM('Продажи'[Сумма]) >= 10000))"
  - "Крупные заказы = COUNTROWS(FILTER('Продажи'; 'Продажи'[Сумма] >= 10000))"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
visual: { rows: "Клиенты[Город]", values: [Выручка] }
hint: "Переберите номера заказов через VALUES и оставьте те, у которых мера [Выручка] не меньше 10 000. Мера внутри FILTER считается для каждого заказа отдельно."
explanation: "Ссылка на меру внутри итератора неявно оборачивается в CALCULATE и превращает текущую строку в фильтр — это переход контекста. Голый SUM внутри FILTER переход не делает и считает сумму всего города для каждого заказа."
tip: "Если в итераторе нужна сумма по текущей строке, используйте меру или CALCULATE(SUM(...)). Это самая частая причина «одинаковых чисел во всех строках»."
