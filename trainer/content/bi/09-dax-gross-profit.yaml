id: dax-gross-profit
slug: sumx-related-valovaya-pribyl
module: bi
track: 3
order: 9
title: Валовая прибыль
seo_title: "SUMX и RELATED в DAX: валовая прибыль — тренажёр Power BI"
check: dax
story: "Себестоимость единицы товара хранится в справочнике «Товары», а количество — в «Продажах». Нужна валовая прибыль: выручка минус себестоимость проданного."
goal: "Создайте меру «Валовая прибыль»: по каждой строке продаж сумма минус количество × себестоимость из «Товаров», и всё сложить."
measure_name: Валовая прибыль
answer: "Валовая прибыль = SUMX('Продажи'; 'Продажи'[Сумма] - 'Продажи'[Количество] * RELATED('Товары'[Себестоимость]))"
alt:
  - "Валовая прибыль = [Выручка] - SUMX('Продажи'; 'Продажи'[Количество] * RELATED('Товары'[Себестоимость]))"
wrong:
  - "Валовая прибыль = [Выручка] - SUM('Товары'[Себестоимость])"
  - "Валовая прибыль = SUM('Продажи'[Сумма]) - SUMX('Продажи'; RELATED('Товары'[Себестоимость]))"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
visual: { rows: "Товары[Категория]", values: [Выручка] }
hint: "SUMX перебирает строки «Продаж». Внутри перебора RELATED достаёт значение из связанной строки справочника «Товары»."
explanation: "SUM('Товары'[Себестоимость]) сложил бы себестоимость по справочнику без учёта количества. SUMX считает выражение в каждой строке продаж, а RELATED идёт по связи «многие к одному» к нужному товару."
tip: "Без RELATED Power BI скажет, что столбец недоступен в контексте строки. Сообщение пугает, но лечится одним словом."
