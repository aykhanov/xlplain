id: dax-rank
slug: rankx-reyting-gorodov
module: bi
track: 3
order: 10
title: Рейтинг городов
seo_title: "RANKX в DAX: рейтинг по выручке — тренажёр Power BI"
check: dax
story: "Для доски лидеров нужно место каждого города по выручке: у самого крупного — 1."
goal: "Создайте меру «Место города»: ранг города по [Выручка] среди всех городов."
measure_name: Место города
answer: "Место города = RANKX(ALL('Клиенты'[Город]); [Выручка])"
alt:
  - "Место города = RANKX(ALL('Клиенты'[Город]); [Выручка]; ; DESC)"
  - "Место города = RANKX(ALL('Клиенты'[Город]); CALCULATE(SUM('Продажи'[Сумма])))"
wrong:
  - "Место города = RANKX(ALL('Клиенты'[Город]); SUM('Продажи'[Сумма]))"
  - "Место города = RANKX(VALUES('Клиенты'[Город]); [Выручка])"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
visual: { rows: "Клиенты[Город]", values: [Выручка] }
hint: "RANKX(таблица; выражение) считает выражение для каждой строки таблицы и сравнивает с текущим значением. Таблица — все города, без фильтра строки."
explanation: "С VALUES в каждой строке матрицы остаётся один город, и он всегда первый. С SUM вместо меры нет перехода контекста, и все города получают одинаковое значение, а значит место 1."
tip: "Чтобы в итоговой строке не стояла единица, оберните меру: IF(ISINSCOPE('Клиенты'[Город]); RANKX(...))."
