id: dax-ytd
slug: totalytd-vyruchka-s-nachala-goda
module: bi
track: 4
order: 13
title: Выручка с начала года
seo_title: "TOTALYTD в DAX: нарастающий итог — тренажёр Power BI"
check: dax
story: "Таблица «Календарь» связана с «Продажами» по дате и отмечена как таблица дат. Руководителю нужна выручка нарастающим итогом с 1 января по каждый месяц."
goal: "Создайте меру «Выручка YTD» — выручку с начала года до конца текущего месяца матрицы."
measure_name: Выручка YTD
answer: "Выручка YTD = TOTALYTD([Выручка]; 'Календарь'[Дата])"
alt:
  - "Выручка YTD = CALCULATE([Выручка]; DATESYTD('Календарь'[Дата]))"
wrong:
  - "Выручка YTD = TOTALYTD([Выручка]; 'Продажи'[Дата])"
  - "Выручка YTD = CALCULATE([Выручка]; ALL('Календарь'))"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
visual: { rows: "Календарь[Месяц]", values: [Выручка] }
hint: "TOTALYTD(мера; столбец дат) берёт даты с 1 января до последней даты в текущем контексте. Столбец дат — из «Календаря»."
explanation: "С датой из «Продаж» фильтр по месяцу из «Календаря» остаётся на месте, и нарастающего итога не получится. Даты из таблицы календаря функция заменяет целиком."
tip: "Месяцы в матрице идут по порядку, потому что у столбца «Месяц» задана сортировка по «Номеру месяца». Без неё апрель окажется первым."
