id: dax-mom
slug: rost-k-proshlomu-mesyacu-dax
module: bi
track: 4
order: 14
title: Рост к прошлому месяцу
seo_title: "PREVIOUSMONTH и VAR в DAX: рост месяц к месяцу — тренажёр Power BI"
check: dax
story: "На дашборде по месяцам нужен процент изменения выручки к предыдущему месяцу. Для июня, первого месяца продаж, сравнивать не с чем — там должно быть пусто."
goal: "Создайте меру «Рост к прошлому месяцу»: (выручка − выручка прошлого месяца) / выручка прошлого месяца. Формат — «Процент»."
measure_name: Рост к прошлому месяцу
answer: "Рост к прошлому месяцу = VAR прошлый = CALCULATE([Выручка]; PREVIOUSMONTH('Календарь'[Дата])) RETURN DIVIDE([Выручка] - прошлый; прошлый)"
alt:
  - "Рост к прошлому месяцу = VAR п = CALCULATE([Выручка]; DATEADD('Календарь'[Дата]; -1; MONTH)) RETURN DIVIDE([Выручка] - п; п)"
wrong:
  - "Рост к прошлому месяцу = DIVIDE([Выручка]; CALCULATE([Выручка]; PREVIOUSMONTH('Календарь'[Дата]))) - 1"
  - "Рост к прошлому месяцу = VAR прошлый = CALCULATE([Выручка]; PREVIOUSMONTH('Календарь'[Дата])) RETURN DIVIDE(прошлый - [Выручка]; прошлый)"
  - "Рост к прошлому месяцу = VAR прошлый = CALCULATE([Выручка]; PREVIOUSMONTH('Продажи'[Дата])) RETURN DIVIDE([Выручка] - прошлый; прошлый)"
measures:
  - "Выручка = SUM('Продажи'[Сумма])"
format: percent
check_rows: ["Календарь[Месяц]"]
check_total: false
visual: { rows: "Календарь[Месяц]", values: [Выручка] }
hint: "Сохраните выручку прошлого месяца в переменную: VAR прошлый = CALCULATE([Выручка]; PREVIOUSMONTH('Календарь'[Дата])). После RETURN поделите разницу на неё через DIVIDE."
explanation: "Переменная считается один раз и делает формулу читаемой. DIVIDE вернёт пусто для июня, где прошлого месяца нет, вместо ошибки деления на ноль."
tip: "Вариант DIVIDE(...) − 1 короче, но в первом месяце покажет −100 % вместо пустой ячейки: в DAX пусто минус единица даёт −1."
