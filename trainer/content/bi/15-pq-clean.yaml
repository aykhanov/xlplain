title: Очистить выгрузку из 1С
seo_title: "Power Query: очистка выгрузки из 1С — тренажёр в браузере"
check: pq
source: export1c
story: "Бухгалтерия прислала отчёт из 1С. Сверху название и период, потом пустая строка и заголовки, между блоками заказов пустые строки, внизу «Итого». Суммы записаны текстом с пробелами."
goal: "Приведите выгрузку к таблице: столбцы Дата, Номер, Клиент, Сумма; без шапки, пустых строк и «Итого». Типы: Дата — дата, Сумма — десятичное число, Номер и Клиент — текст."
answer:
  - { op: removeTop, n: 3 }
  - { op: promote }
  - { op: removeBlank }
  - { op: filter, col: Дата, exclude: ["Итого"] }
  - { op: type, cols: { Дата: date, Номер: text, Клиент: text, Сумма: number } }
hint: "Порядок важен: сначала удалите три верхние строки, чтобы заголовки оказались первой строкой, и повысьте их. Потом уберите пустые строки и «Итого» (фильтр по столбцу «Дата»), и только в конце меняйте типы."
explanation: "Если поменять тип «Дата» до удаления «Итого», в этой строке появится ошибка. А удаление по фильтру переживёт любое число заказов в следующей выгрузке, в отличие от удаления строк по номерам."
tip: "Сохраните запрос и в следующий раз просто положите новую выгрузку вместо старой: Главная → Обновить. Все шаги повторятся сами."
