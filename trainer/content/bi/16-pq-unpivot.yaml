id: pq-unpivot
slug: power-query-otmenit-svertyvanie-stolbcov
module: bi
track: 5
order: 16
title: Развернуть месяцы в строки
seo_title: "Power Query: отменить свёртывание столбцов (unpivot) — тренажёр"
check: pq
source: plan
story: "План продаж сделан в Excel «в ширину»: менеджеры по строкам, месяцы по столбцам. Для Power BI нужна длинная таблица, иначе не построить ни срез по месяцам, ни сравнение с фактом."
goal: "Получите таблицу из трёх столбцов: Менеджер (текст), Месяц (текст), План (десятичное число). Пустые ячейки плана в результат не попадают."
answer:
  - { op: promote }
  - { op: unpivotOther, cols: [Менеджер] }
  - { op: rename, col: Атрибут, to: Месяц }
  - { op: rename, col: Значение, to: План }
  - { op: type, cols: { Менеджер: text, Месяц: text, План: number } }
hint: "Повысьте заголовки, выделите столбец «Менеджер» и выберите «Отменить свертывание других столбцов» (вкладка «Преобразование» или правый щелчок). Потом переименуйте «Атрибут» и «Значение»."
explanation: "«Отменить свертывание других столбцов» запоминает, какой столбец оставить, а не какие развернуть. Когда в файле появится декабрь, запрос подхватит его без правок."
tip: "Пустые ячейки при развороте пропадают сами. Если нулевой план важен, сначала замените null на 0 через «Заменить значения»."
