slug: power-query-zapolnit-vniz-gruppirovat
module: bi
track: 5
order: 17
title: Заполнить вниз и сгруппировать
seo_title: "Power Query: заполнить вниз и группировать по — тренажёр"
check: pq
source: stock
story: "Отчёт об остатках из 1С: название категории стоит только в первой строке группы, ниже пусто. Суммы записаны текстом. Нужен итог остатков по категориям."
goal: "Получите таблицу из двух столбцов: Категория (текст) и Сумма (десятичное число) — сумма остатков по каждой категории."
answer:
  - { op: promote }
  - { op: fillDown, cols: [Категория] }
  - { op: type, cols: { Категория: text, Сумма: number } }
  - { op: group, by: [Категория], aggs: [{ name: Сумма, op: sum, col: Сумма }] }
hint: "Повысьте заголовки, выделите «Категория» и выберите «Заполнить → Вниз». Поменяйте тип «Суммы» на десятичное число и сгруппируйте по категории с операцией «Сумма»."
explanation: "Без заполнения вниз строки с пустой категорией сгруппировались бы в отдельную группу null. А без смены типа Power Query не сможет сложить суммы: текст не складывается."
tip: "Заполнить вниз работает только с null. Если в пустых ячейках пробелы или пустые строки, сначала замените их на null через «Заменить значения»."
