title: Итог за месяц
fn: СУММ
seo_title: "СУММ в Excel: задача «Итог за месяц» с решением"
story: Вы записали расходы за месяц. Сколько ушло всего?
goal: Посчитайте сумму всех расходов
grid:
  - [ Статья, "Сумма, ₽" ]
  - [ Аренда, 35000 ]
  - [ Продукты, 18400 ]
  - [ Транспорт, 4200 ]
  - [ Связь, 1100 ]
  - [ Развлечения, 6500 ]
  - [ Итого, null ]
target: B7
answer: =СУММ(B2:B6)
hint: "Функция СУММ складывает диапазон. Диапазон — это «от и до» через двоеточие: B2:B6. Можно не печатать адреса, а протянуть мышкой по ячейкам."
tip: "Alt + = вставляет СУММ сама: встаньте под столбцом чисел, нажмите сочетание, и Excel подберёт диапазон."
xlplain: Когда строк сотни, а итоги нужны по месяцам и категориям, в XLPlain сводная таблица и дашборд с KPI и графиками собираются мастером за пару кликов.
verified: перенесено из тренажёра v1, проверено в Excel ранее
