track: 1
order: 4
title: Цена со скидкой
fn: "%"
seo_title: "Формула в Excel: задача «Цена со скидкой» с решением"
story: Куртка стоит 12 900 ₽, на неё скидка. Сколько она стоит теперь?
goal: Посчитайте цену с учётом скидки
grid:
  - [ "Цена, ₽", 12900 ]
  - [ "Скидка, %", 15 ]
  - [ Цена со скидкой, null ]
target: B3
answer: =B1*(1-B2/100)
hint: "Скидка 15% — это 15/100 от цены. Цена со скидкой = цена − цена × скидка / 100. Или короче: =B1*(1-B2/100)."
tip: "Процент скидки держите в отдельной ячейке и ссылайтесь на неё. Чтобы ссылка не съезжала при копировании, нажмите F4: B2 превратится в $B$2."
verified: перенесено из тренажёра v1, проверено в Excel ранее
