id: if
slug: esli-plan-vypolnen
module: excel
track: 2
order: 8
title: План выполнен?
fn: ЕСЛИ
seo_title: "ЕСЛИ в Excel: задача «План выполнен?» с решением"
story: Руководитель хочет сразу видеть, выполнил ли менеджер план.
goal: Выведите «Да», если факт не меньше плана, иначе «Нет»
grid:
  - [ Менеджер, План, Факт, Выполнил? ]
  - [ Ольга, 500000, 540000, null ]
target: D2
answer: =ЕСЛИ(C2>=B2;"Да";"Нет")
hint: 'ЕСЛИ(условие; что вывести, если да; что вывести, если нет). Текст пишется в кавычках, части разделяются точкой с запятой: =ЕСЛИ(C2>=B2;"Да";"Нет").'
tip: 'Сравнивать можно и текст: =ЕСЛИ(B2="Москва";…). Регистр букв ЕСЛИ не различает, а вот лишний пробел — различает.'
verified: перенесено из тренажёра v1, проверено в Excel ранее
