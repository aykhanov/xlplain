id: vlookup
slug: vpr-nayti-cenu
module: excel
track: 2
order: 11
title: Найти цену
fn: ВПР
seo_title: "ВПР в Excel: задача «Найти цену» с решением"
story: В прайсе десятки позиций. Нужно, чтобы цена подтягивалась сама, когда вводишь название.
goal: Найдите цену товара из ячейки E2
grid:
  - [ Товар, "Цена, ₽", null, null, Ищем, "Цена, ₽" ]
  - [ Чай чёрный, 320, null, null, Чай зелёный, null ]
  - [ Чай зелёный, 410 ]
  - [ Кофе молотый, 690 ]
  - [ Кофе в зёрнах, 890 ]
  - [ Какао, 450 ]
  - [ Цикорий, 270 ]
target: F2
answer: =ВПР(E2;A2:B7;2;0)
vary:
  - cells: E2
    oneOf: [ Чай чёрный, Чай зелёный, Кофе молотый, Кофе в зёрнах, Какао, Цикорий ]
hint: "ВПР(что ищем; где ищем; из какого столбца взять; 0). Ноль в конце — «искать точное совпадение». Цена во 2-м столбце таблицы: =ВПР(E2;A2:B7;2;0)."
tip: "Всегда ставьте 0 в конце ВПР и закрепляйте таблицу клавишей F4: =ВПР(E2;$A$2:$B$7;2;0). Иначе при протягивании диапазон «уедет» вниз."
xlplain: ВПР хорош для одной таблицы. Когда надо сверить два файла или целые папки по ключевым полям, в XLPlain это делается одной командой.
verified: перенесено из тренажёра v1, проверено в Excel ранее
