title: Сколько коробок
fn: ОКРУГЛВВЕРХ
seo_title: "ОКРУГЛВВЕРХ в Excel: задача «Сколько коробок» с решением"
story: Нужно отправить партию товара. В коробку помещается фиксированное количество, и неполная коробка — всё равно коробка.
goal: Посчитайте, сколько коробок понадобится
grid:
  - [ "Нужно отправить, шт", 230 ]
  - [ "В одну коробку, шт", 24 ]
  - [ Нужно коробок, null ]
target: B3
answer: =ОКРУГЛВВЕРХ(B1/B2;0)
hint: "Делим количество на вместимость и округляем всегда вверх: =ОКРУГЛВВЕРХ(B1/B2;0). Обычное ОКРУГЛ превратит 9,6 в 10, а 9,2 в 9 — и одной коробки не хватит."
tip: ОКРУГЛВВЕРХ — для штук, коробок и рейсов, где 2,1 значит 3. Для денег обычно хватает ОКРУГЛ.
verified: перенесено из тренажёра v1, проверено в Excel ранее
