id: concat
slug: scepit-imya-celikom
module: excel
track: 3
order: 16
title: Имя целиком
fn: "&"
seo_title: "& в Excel: задача «Имя целиком» с решением"
story: Имя и фамилия лежат в разных столбцах, а для рассылки нужны вместе.
goal: Соберите «Имя Фамилия» через пробел
grid:
  - [ Имя, Фамилия, Полное имя ]
  - [ Анна, Петрова, null ]
target: C2
answer: =A2&" "&B2
vary:
  - cells: A2
    oneOf: [ Анна, Игорь, Мария, Олег, Дина ]
  - cells: B2
    oneOf: [ Петрова, Смирнов, Ким, Орлова, Гусев ]
hint: 'Знак & склеивает текст. Пробел — это тоже текст, его пишут в кавычках: =A2&" "&B2. Или функцией: =СЦЕПИТЬ(A2;" ";B2).'
tip: "В новых версиях Excel есть ОБЪЕДИНИТЬ: склеивает целый диапазон через разделитель и умеет пропускать пустые ячейки."
xlplain: "Имена с лишними пробелами, разным регистром и перепутанным порядком XLPlain приводит в порядок кнопкой «очистка данных»: ФИО, даты, телефоны, email."
verified: перенесено из тренажёра v1, проверено в Excel ранее
