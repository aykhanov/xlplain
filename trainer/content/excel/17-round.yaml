title: Красивая оценка
fn: ОКРУГЛ
seo_title: "ОКРУГЛ в Excel: задача «Красивая оценка» с решением"
story: Средняя оценка курса выходит с длинным хвостом после запятой. Нужно до одного знака.
goal: Найдите среднее и округлите до 1 знака после запятой
grid:
  - [ Ученик, Балл ]
  - [ Лена, 4.6 ]
  - [ Артём, 3.9 ]
  - [ Вика, 4.8 ]
  - [ Денис, 4.1 ]
  - [ Саша, 4.4 ]
  - [ Юля, 3.7 ]
  - [ Среднее, null ]
target: B8
answer: =ОКРУГЛ(СРЗНАЧ(B2:B7);1)
hint: "Функции можно вкладывать друг в друга: сначала СРЗНАЧ, а результат — в ОКРУГЛ. =ОКРУГЛ(СРЗНАЧ(B2:B7);1)."
tip: Формат ячейки только прячет знаки после запятой, а ОКРУГЛ меняет само число. Из-за этого итог в отчёте может разойтись на копейки.
verified: перенесено из тренажёра v1, проверено в Excel ранее
