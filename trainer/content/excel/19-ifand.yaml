id: ifand
slug: esli-i-dva-usloviya
module: excel
track: 3
order: 19
title: Кому бонус
fn: ЕСЛИ + И
seo_title: "ЕСЛИ + И в Excel: задача «Кому бонус» с решением"
story: Бонус 5 000 ₽ получает тот, кто продал минимум на 100 000 ₽ и работает в компании от 1 года.
goal: Выведите 5000, если оба условия выполнены, иначе 0
grid:
  - [ Сотрудник, "Продажи, ₽", "Стаж, лет", "Бонус, ₽" ]
  - [ Марат, 128000, 2, null ]
target: D2
answer: =ЕСЛИ(И(B2>=100000;C2>=1);5000;0)
vary:
  - cells: B2
    oneOf: [ 60000, 99000, 100000, 145000, 210000 ]
  - cells: C2
    oneOf: [ 0, 1, 3 ]
hint: "Функция И проверяет несколько условий сразу и возвращает ИСТИНА, только если выполнены все. Вставьте её внутрь ЕСЛИ: =ЕСЛИ(И(B2>=100000;C2>=1);5000;0)."
tip: "Для «хотя бы одно условие» есть ИЛИ: =ЕСЛИ(ИЛИ(B2>=100000;C2>=3);…). И и ИЛИ можно вкладывать друг в друга."
verified: перенесено из тренажёра v1, проверено в Excel ранее
