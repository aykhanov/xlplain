id: iferror
slug: esliosibka-net-v-nalichii
module: excel
track: 3
order: 20
title: Нет в наличии
fn: ЕСЛИОШИБКА
seo_title: "ЕСЛИОШИБКА в Excel: задача «Нет в наличии» с решением"
story: "Если товара нет в прайсе, ВПР показывает некрасивую ошибку #Н/Д. Покупатель должен видеть понятный текст."
goal: Найдите цену, а если товара нет — выведите «Нет в наличии»
grid:
  - [ Товар, "Цена, ₽", null, null, Ищем, "Цена, ₽" ]
  - [ Чай чёрный, 320, null, null, Матча, null ]
  - [ Чай зелёный, 410 ]
  - [ Кофе молотый, 690 ]
  - [ Кофе в зёрнах, 890 ]
  - [ Какао, 450 ]
  - [ Цикорий, 270 ]
target: F2
answer: =ЕСЛИОШИБКА(ВПР(E2;A2:B7;2;0);"Нет в наличии")
vary:
  - cells: E2
    oneOf: [ Матча, Какао, Цикорий, Ройбуш, Чай чёрный ]
hint: 'Оберните ВПР в ЕСЛИОШИБКА(формула; что показать вместо ошибки): =ЕСЛИОШИБКА(ВПР(E2;A2:B7;2;0);"Нет в наличии").'
tip: ЕСЛИОШИБКА прячет любые ошибки, даже опечатку в формуле. Если нужно скрыть только «не найдено», используйте ЕСНД.
xlplain: «Что есть в одном списке и нет в другом» — главный вопрос сверки. XLPlain сверяет два файла по ключу и объединяет от 2 до 6 таблиц без единой формулы.
verified: перенесено из тренажёра v1, проверено в Excel ранее
