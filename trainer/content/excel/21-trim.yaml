id: trim
slug: szhprobely-lishnie-probely
module: excel
track: 3
order: 21
title: Лишние пробелы
fn: СЖПРОБЕЛЫ
seo_title: "СЖПРОБЕЛЫ в Excel: задача «Лишние пробелы» с решением"
story: Данные выгрузили из CRM, и в названиях клиентов полно лишних пробелов. Из-за них ВПР ничего не находит.
goal: Уберите лишние пробелы из названия
grid:
  - [ Из выгрузки, Чисто ]
  - [ "  ООО   Ромашка ", null ]
target: B2
answer: =СЖПРОБЕЛЫ(A2)
vary:
  - cells: A2
    oneOf: [ "  ИП  Соколов", "Кофе   Хауз  ", " Альфа  Строй ", ООО  Вектор ]
hint: "СЖПРОБЕЛЫ убирает пробелы в начале и в конце, а двойные пробелы внутри превращает в одинарные: =СЖПРОБЕЛЫ(A2)."
tip: 'СЖПРОБЕЛЫ не видит неразрывный пробел из выгрузок 1С. Его убирают так: =СЖПРОБЕЛЫ(ПОДСТАВИТЬ(A2;СИМВОЛ(160);" ")).'
xlplain: Пробелы, даты текстом, телефоны в десяти форматах — всё это XLPlain чистит одной кнопкой по всей таблице сразу.
verified: перенесено из тренажёра v1, проверено в Excel ранее
