id: substitute
slug: podstavit-telefon-bez-probelov
module: excel
track: 3
order: 24
title: Телефон без пробелов
fn: ПОДСТАВИТЬ
seo_title: "ПОДСТАВИТЬ в Excel: задача «Телефон без пробелов» с решением"
story: Сервис рассылок принимает номера только без пробелов.
goal: Уберите из номера все пробелы
grid:
  - [ Телефон, Для рассылки ]
  - [ +7 900 123 45 67, null ]
target: B2
answer: =ПОДСТАВИТЬ(A2;" ";"")
vary:
  - cells: A2
    template: +7 9{oneOf:00|16|25|77} {int:100-998} {int:10-98} {int:10-98}
hint: 'ПОДСТАВИТЬ(текст; что заменить; на что). Пробел меняем на пустую строку: =ПОДСТАВИТЬ(A2;" ";"").'
tip: 'ПОДСТАВИТЬ можно вкладывать саму в себя, чтобы за раз убрать пробелы, скобки и дефисы: =ПОДСТАВИТЬ(ПОДСТАВИТЬ(A2;" ";"");"-";"").'
xlplain: Телефоны в десяти разных форматах XLPlain приводит к одному виду одной галочкой в очистке данных.
verified: перенесено из тренажёра v1, проверено в Excel ранее
