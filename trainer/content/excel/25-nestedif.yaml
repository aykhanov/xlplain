title: Скидка по сумме
fn: ЕСЛИ в ЕСЛИ
seo_title: "ЕСЛИ в ЕСЛИ в Excel: задача «Скидка по сумме» с решением"
story: "Правило магазина: от 50 000 ₽ скидка 10%, от 20 000 ₽ — 5%, меньше — без скидки."
goal: "Выведите скидку: 10%, 5% или 0"
grid:
  - [ Клиент, "Сумма заказа, ₽", Скидка ]
  - [ ООО Альфа, 34000, null ]
target: C2
answer: =ЕСЛИ(B2>=50000;10%;ЕСЛИ(B2>=20000;5%;0))
vary:
  - cells: B2
    oneOf: [ 12000, 20000, 34000, 50000, 78000 ]
hint: "Внутрь «если нет» первого ЕСЛИ ставим второе ЕСЛИ. Проверяем с самого большого порога: =ЕСЛИ(B2>=50000;10%;ЕСЛИ(B2>=20000;5%;0))."
tip: Когда вариантов больше трёх, вложенные ЕСЛИ становятся нечитаемыми. Удобнее таблица порогов и интервальный ВПР — такая задача есть в продвинутом уровне.
verified: перенесено из тренажёра v1, проверено в Excel ранее
