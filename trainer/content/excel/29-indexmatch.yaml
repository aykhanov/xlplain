hint: "ПОИСКПОЗ(что ищем; где; 0) вернёт номер строки, где нашёлся заказ. ИНДЕКС(столбец с ответом; этот номер) достанет имя: =ИНДЕКС(A2:A7;ПОИСКПОЗ(D2;B2:B7;0))."
tip: ИНДЕКС + ПОИСКПОЗ не ломается, если вставить столбец в середину таблицы, и ищет в любую сторону. В Excel 365 то же самое умеет ПРОСМОТРX.
