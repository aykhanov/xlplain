title: Скидка по сетке
fn: ВПР интервальный
seo_title: "ВПР интервальный в Excel: задача «Скидка по сетке» с решением"
story: Скидки заданы таблицей порогов справа. Нужно подобрать скидку для суммы клиента.
goal: Найдите скидку по сетке для суммы из B2
grid:
  - [ Клиент, "Сумма, ₽", Скидка, null, "От суммы, ₽", Скидка ]
  - [ ООО Альфа, 34000, null, null, 0, 0 ]
  - [ null, null, null, null, 10000, 0.03 ]
  - [ null, null, null, null, 30000, 0.05 ]
  - [ null, null, null, null, 50000, 0.1 ]
target: C2
answer: =ВПР(B2;E2:F5;2;1)
fixed: [ E2, E3, E4, E5, F2, F3, F4, F5 ]
vary:
  - cells: B2
    oneOf: [ 5000, 10000, 29999, 30000, 64000 ]
hint: "С последним аргументом 1 ВПР ищет не точное совпадение, а ближайший порог снизу. Таблица порогов должна идти по возрастанию: =ВПР(B2;E2:F5;2;1)."
tip: "Интервальный ВПР удобен для налоговых ставок, бонусных сеток и тарифов: правила живут в таблице, а не в формуле, и меняются без правки формул."
verified: перенесено из тренажёра v1, проверено в Excel ранее
