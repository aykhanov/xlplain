id: vat-extract
slug: vydelit-nds-iz-summy
module: excel
track: 5
order: 32
title: Выделить НДС из суммы
fn: ОКРУГЛ · %
seo_title: "Как выделить НДС из суммы в Excel — задача с решением"
story: Поставщик прислал счёт с суммой «в том числе НДС». Для проводки нужна сумма налога отдельно.
goal: Посчитайте НДС, который входит в сумму счёта, с точностью до копеек
grid:
  - [ Счёт, "Сумма с НДС, ₽", "НДС, ₽", "Ставка НДС, %" ]
  - [ № 418, 122000, null, 22 ]
target: C2
answer: =ОКРУГЛ(B2*D2/(100+D2);2)
fixed: [ D2 ]
vary:
  - cells: D2
    oneOf: [ 22, 10, 20 ]
hint: "НДС внутри суммы = сумма × ставка / (100 + ставка). При ставке 22% это сумма × 22/122. ОКРУГЛ(…;2) оставляет копейки, как в счёте-фактуре."
tip: Держите ставку в отдельной ячейке и ссылайтесь на неё. Когда ставка меняется, правите одну ячейку, а не все формулы.
verified: новая задача, нужна проверка в Excel
