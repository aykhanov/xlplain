slug: nachislit-nds-sverhu
module: excel
track: 5
order: 33
title: Начислить НДС сверху
fn: ОКРУГЛ · %
seo_title: "Как начислить НДС сверху в Excel — задача с решением"
story: Вы выставляете счёт на 85 000 ₽ без НДС. Покупатель должен заплатить сумму вместе с налогом.
goal: Посчитайте сумму к оплате с НДС, с точностью до копеек
grid:
  - [ Услуга, "Сумма без НДС, ₽", "Сумма с НДС, ₽", "Ставка НДС, %" ]
  - [ Консультация, 85000, null, 22 ]
target: C2
answer: =ОКРУГЛ(B2*(1+D2/100);2)
fixed: [ D2 ]
vary:
  - cells: D2
    oneOf: [ 22, 10, 20 ]
hint: "Сумма с НДС = сумма × (1 + ставка/100). При 22% это сумма × 1,22."
tip: "Чтобы проверить себя, разделите сумму с НДС на 1,22 — должна получиться исходная сумма без налога."
verified: новая задача, нужна проверка в Excel
