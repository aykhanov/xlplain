id: sverka
slug: sverka-dvuh-spiskov-schetesli
module: excel
track: 5
order: 34
title: Есть ли счёт в выписке банка
fn: ЕСЛИ + СЧЁТЕСЛИ
seo_title: "Сверка двух списков в Excel через СЧЁТЕСЛИ — задача с решением"
story: Слева счета из 1С, справа номера счетов, по которым прошла оплата в выписке банка. Нужно отметить, оплачен ли счёт.
goal: Напишите в C2 «есть», если счёт из A2 найден в выписке (E2:E7), и «нет», если не найден
grid:
  - [ Счёт из 1С, "Сумма, ₽", В выписке?, null, Оплачено по счетам ]
  - [ С-1044, 18400, null, null, С-1041 ]
  - [ С-1045, 9200, null, null, С-1043 ]
  - [ С-1046, 31000, null, null, С-1044 ]
  - [ null, null, null, null, С-1047 ]
  - [ null, null, null, null, С-1049 ]
  - [ null, null, null, null, С-1050 ]
target: C2
answer: =ЕСЛИ(СЧЁТЕСЛИ(E2:E7;A2)>0;"есть";"нет")
vary:
  - cells: A2
    oneOf: [ С-1041, С-1042, С-1044, С-1045, С-1049, С-1051 ]
hint: СЧЁТЕСЛИ считает, сколько раз номер счёта встречается в выписке. Больше нуля — счёт оплачен, ноль — нет. ЕСЛИ превращает это в «есть» или «нет».
tip: "Закрепите диапазон выписки знаками доллара ($E$2:$E$7) и протяните формулу на весь список счетов — диапазон не съедет."
xlplain: Сверить целиком два реестра по номеру и сумме, с отчётом о расхождениях, XLPlain умеет без формул — инструментом «Сверка».
verified: новая задача, нужна проверка в Excel
