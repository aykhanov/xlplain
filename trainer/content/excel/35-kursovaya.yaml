title: Курсовая разница
fn: формула
seo_title: "Как посчитать курсовую разницу в Excel — задача с решением"
story: Товар отгрузили по контракту в долларах, а оплата пришла позже, когда курс изменился. Курсы в задаче условные.
goal: Посчитайте курсовую разницу в рублях между датой отгрузки и датой оплаты
grid:
  - [ Показатель, Значение ]
  - [ "Сумма контракта, $", 12000 ]
  - [ "Курс на дату отгрузки, ₽", 92.4 ]
  - [ "Курс на дату оплаты, ₽", 94.1 ]
  - [ "Курсовая разница, ₽", null ]
target: B5
answer: =B2*(B4-B3)
hint: Курсовая разница = сумма в валюте × (курс на дату оплаты − курс на дату отгрузки). Плюс — положительная разница, минус — отрицательная.
tip: Курсы ЦБ на нужные даты удобно держать в отдельной таблице и подтягивать ВПР по дате, а не вписывать руками.
verified: новая задача, нужна проверка в Excel
