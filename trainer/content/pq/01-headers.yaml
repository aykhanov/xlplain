title: Заголовки из первой строки
seo_title: 'Power Query: использовать первую строку в качестве заголовков — тренажёр'
check: pq
source: staff
story: Коллега прислал список сотрудников. Power Query прочитал лист и назвал столбцы Column1 и Column2, а настоящие заголовки оказались первой строкой данных.
goal: Сделайте первую строку заголовками и задайте обоим столбцам тип «Текст».
answer:
- {op: promote}
- op: type
  cols: {ФИО: text, Должность: text}
hint: На вкладке «Главная» нажмите «Использовать первую строку в качестве заголовков». Потом выделите оба столбца (Ctrl+щелчок по заголовкам) и выберите тип «Текст».
explanation: 'Тип по умолчанию «Любой» (значок ABC123) ничего не гарантирует: в столбец может попасть что угодно. Явный тип защищает от сюрпризов при обновлении.'
tip: Выделить несколько столбцов можно щелчком с Ctrl, а все сразу — Ctrl+A в сетке. Тип тогда меняется одним шагом.
