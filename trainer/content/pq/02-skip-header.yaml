title: Убрать шапку отчёта
seo_title: 'Power Query: удалить верхние строки отчёта 1С — тренажёр'
check: pq
source: export1c
story: Отчёт из 1С начинается с названия, периода и пустой строки. Настоящие заголовки «Дата, Номер, Клиент, Сумма» стоят только в четвёртой строке.
goal: Удалите три верхние строки и сделайте следующую строку заголовками. Пустые строки и «Итого» пока не трогайте.
answer:
- {op: removeTop, n: 3}
- {op: promote}
hint: «Главная» → «Удалить строки» → «Удалить верхние строки», число строк 3. Затем «Использовать первую строку в качестве заголовков».
explanation: Шапка отчёта из 1С всегда одной высоты, поэтому удаление по количеству строк здесь надёжно. А строки в середине и внизу удаляют фильтром — их число меняется.
tip: Если высота шапки плавает, используйте фильтр по первому столбцу или «Удалить строки → Удалить альтернативные строки».
