id: pq-clean-1c
slug: power-query-ochistit-otchet-1s
module: pq
track: 1
order: 3
title: Очистить отчёт из 1С полностью
seo_title: 'Power Query: очистка выгрузки из 1С от пустых строк и итогов — тренажёр'
check: pq
source: export1c
story: Тот же отчёт из 1С. Кроме шапки, в нём пустые строки между блоками заказов и строка «Итого» внизу, а суммы записаны текстом с пробелами.
goal: 'Получите таблицу Дата, Номер, Клиент, Сумма без шапки, пустых строк и «Итого». Типы: Дата — дата, Сумма — десятичное число, Номер и Клиент — текст.'
answer:
- {op: removeTop, n: 3}
- {op: promote}
- {op: removeBlank}
- op: filter
  col: Дата
  exclude: [Итого]
- op: type
  cols: {Дата: date, Номер: text, Клиент: text, Сумма: number}
hint: 'Порядок: шапка → заголовки → пустые строки → фильтр «Итого» в столбце «Дата» → типы. Если сменить тип даты раньше фильтра, в строке «Итого» появится ошибка.'
explanation: Фильтр по значению «Итого» сработает и в следующем месяце, сколько бы заказов ни было. Типы меняют последними, когда в столбцах остались только данные.
tip: 'Сохраните запрос и в следующий раз просто положите новую выгрузку вместо старой: «Главная» → «Обновить». Все шаги повторятся сами.'
