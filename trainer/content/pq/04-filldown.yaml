module: pq
track: 1
order: 4
title: Заполнить пустые ячейки сверху
seo_title: 'Power Query: заполнить вниз пустые ячейки — тренажёр'
check: pq
source: stock
story: В отчёте об остатках категория указана только в первой строке группы, ниже пусто. Для сводной и фильтров категория нужна в каждой строке.
goal: 'Сделайте заголовки из первой строки и заполните пустые ячейки «Категории» значением сверху. Типы: Категория и Товар — текст, «Остаток, шт» — целое число, Сумма — десятичное число.'
answer:
- {op: promote}
- op: fillDown
  cols: [Категория]
- op: type
  cols: {Категория: text, Товар: text, 'Остаток, шт': int, Сумма: number}
hint: Выделите «Категория» и выберите «Преобразование» → «Заполнить» → «Вниз» (или правый щелчок по заголовку).
explanation: '«Заполнить вниз» берёт последнее непустое значение сверху. Это работает только с null: если в ячейке пробел или пустая строка, сначала замените её на null.'
tip: 'Тот же приём спасает объединённые ячейки из Excel: после загрузки в Power Query значение остаётся только в первой строке.'
