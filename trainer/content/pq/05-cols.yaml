id: pq-cols
slug: power-query-udalit-i-pereimenovat-stolbcy
module: pq
track: 1
order: 5
title: Лишние столбцы и понятные имена
seo_title: 'Power Query: удалить и переименовать столбцы — тренажёр'
check: pq
source: orders
story: Таблица заказов пойдёт в отчёт для руководителя. Номер заказа, дата и менеджер ему не нужны, а «Сумма» в отчёте должна называться «Выручка».
goal: Оставьте столбцы Клиент, Город и Выручка (бывшая «Сумма»).
answer:
- op: removeCols
  cols: [Номер заказа, Дата, Менеджер]
- {op: rename, col: Сумма, to: Выручка}
hint: Выделите ненужные столбцы с Ctrl и нажмите «Удалить столбцы» или выделите нужные и выберите «Удалить другие столбцы». Переименовать — двойной щелчок по заголовку.
explanation: '«Удалить другие столбцы» надёжнее, когда в источнике со временем появляются новые столбцы: в отчёт они не попадут.'
tip: Переименовывайте столбцы в самом конце запроса. Тогда шаги в середине не сломаются, если имя понадобится поменять ещё раз.
