id: pq-trim-proper
slug: power-query-usech-i-propisnye
module: pq
track: 2
order: 6
title: Привести имена клиентов в порядок
seo_title: 'Power Query: убрать пробелы и регистр — Text.Trim и Text.Proper'
check: pq
source: clientsRaw
story: 'Выгрузка клиентов из CRM: имена набраны КАПСОМ, строчными, с пробелами в начале и в конце. Из-за этого ВПР по имени ничего не находит.'
goal: Сделайте заголовки из первой строки, уберите лишние пробелы в «Клиенте» и приведите имена к виду «Каждое Слово С Прописной».
answer:
- {op: promote}
- op: trim
  cols: [Клиент]
- op: proper
  cols: [Клиент]
hint: Выделите «Клиент», затем «Преобразование» → «Формат» → «Усечь», потом там же «Каждое Слово С Прописной».
explanation: «Усечь» удаляет пробелы только по краям, внутри строки они остаются. «Каждое Слово С Прописной» делает первую букву каждого слова заглавной, остальные строчными.
tip: 'Для двойных пробелов внутри имени добавьте «Заменить значения»: два пробела на один.'
