id: pq-replace
slug: power-query-zamenit-znacheniya
module: pq
track: 2
order: 7
title: Убрать «г.» перед городом
seo_title: 'Power Query: заменить значения в столбце — тренажёр'
check: pq
source: clientsRaw
story: В той же выгрузке город записан то как «г. Москва», то как «Москва». В сводной это два разных города.
goal: Сделайте заголовки из первой строки и уберите «г. » перед названием города в столбце «Город».
answer:
- {op: promote}
- op: replace
  cols: [Город]
  find: 'г. '
  repl: ''
hint: 'Выделите «Город», «Заменить значения»: что искать — «г. » (с пробелом), на что заменить — оставьте пустым.'
explanation: Замена в текстовом столбце работает по части текста, поэтому «г. Москва» превращается в «Москва», а «Москва» остаётся как есть.
tip: Если нужно заменить ячейку только целиком, в окне «Заменить значения» есть флажок «Сопоставить содержимое всей ячейки» в дополнительных параметрах.
