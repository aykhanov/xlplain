id: pq-dedupe
slug: power-query-udalit-dublikaty
module: pq
track: 2
order: 8
title: Удалить дубликаты клиентов
seo_title: 'Power Query: удалить дубликаты после очистки — тренажёр'
check: pq
source: clientsRaw
story: 'Часть клиентов попала в выгрузку дважды: один раз КАПСОМ, второй раз нормально, да ещё с «г.» и без. Пока текст не очищен, Power Query считает такие строки разными.'
goal: Сделайте заголовки, очистите «Клиент» (усечь и Каждое Слово С Прописной), уберите «г. » в «Городе» и удалите повторяющиеся строки.
answer:
- {op: promote}
- op: trim
  cols: [Клиент]
- op: proper
  cols: [Клиент]
- op: replace
  cols: [Город]
  find: 'г. '
  repl: ''
- op: dedupe
  cols: []
hint: Сначала вся очистка текста, потом выделите все столбцы (Ctrl+A) и «Главная» → «Удалить строки» → «Удалить дубликаты».
explanation: Удаление дубликатов сравнивает значения точно, с учётом регистра и пробелов. Поэтому его ставят после очистки, иначе «БЕЛОВ ОЛЕГ» и «Белов Олег» останутся оба.
tip: Если выделить только столбец «Клиент», дубликаты будут искаться по нему одному, а из повторов останется первая строка.
