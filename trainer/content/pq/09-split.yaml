id: pq-split
slug: power-query-razdelit-stolbec-fio
module: pq
track: 2
order: 9
title: Разделить ФИО на три столбца
seo_title: 'Power Query: разделить столбец по разделителю — тренажёр'
check: pq
source: staff
story: Для кадрового отчёта нужны отдельно фамилия, имя и отчество, а в списке сотрудников ФИО записано одной строкой через пробел.
goal: Сделайте заголовки, разделите «ФИО» по пробелу и назовите новые столбцы Фамилия, Имя, Отчество.
answer:
- {op: promote}
- {op: split, col: ФИО, delim: ' '}
- {op: rename, col: ФИО.1, to: Фамилия}
- {op: rename, col: ФИО.2, to: Имя}
- {op: rename, col: ФИО.3, to: Отчество}
hint: Выделите «ФИО», «Преобразование» → «Разделить столбец» → «По разделителю», разделитель — пробел. Новые столбцы называются ФИО.1, ФИО.2, ФИО.3 — переименуйте их.
explanation: Разделение по каждому вхождению даёт столько столбцов, сколько частей в самой длинной строке. Если у кого-то двойная фамилия через пробел, появится четвёртый столбец.
tip: Обратная задача — склеить столбцы — решается выделением нескольких столбцов и командой «Объединить столбцы» или формулой Text.Combine.
