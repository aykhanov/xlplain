id: pq-extract
slug: power-query-izvlech-tekst-mezhdu-razdelitelyami
module: pq
track: 2
order: 10
title: Номер счёта из назначения платежа
seo_title: 'Power Query: извлечь текст между разделителями — тренажёр'
check: pq
source: bank
story: 'В банковской выписке номер счёта спрятан в назначении платежа: «Оплата по счёту № 1045 от 12.06.2026, в т.ч. НДС 22%». Для сверки нужен отдельный столбец с номером.'
goal: 'Сделайте заголовки. В «Назначении платежа» оставьте только номер счёта и переименуйте столбец в «Номер счёта». Типы: Дата — дата, Плательщик — текст, Сумма — десятичное число, Номер счёта — целое число.'
answer:
- {op: promote}
- {op: extract, col: Назначение платежа, mode: between, delim: '№ ', delim2: ' от'}
- {op: rename, col: Назначение платежа, to: Номер счёта}
- op: type
  cols: {Дата: date, Плательщик: text, Сумма: number, Номер счёта: int}
hint: '«Преобразование» → «Извлечь» → «Текст между разделителями»: начальный «№ » (с пробелом), конечный « от» (с пробелом впереди).'
explanation: Команды «Извлечь» на вкладке «Преобразование» меняют столбец на месте, а на вкладке «Добавить столбец» создают новый и оставляют исходный.
tip: 'Если номер иногда пишут без «№», извлеките текст после «счёту » и до пробела: «Текст после разделителя», потом «Текст перед разделителем».'
