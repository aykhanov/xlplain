id: pq-price
slug: power-query-tekst-v-chislo-oshibki
module: pq
track: 2
order: 11
title: Цены текстом и ошибки типа
seo_title: 'Power Query: превратить текст в число и удалить ошибки — тренажёр'
check: pq
source: priceText
story: 'Прайс поставщика: цена записана как «1 500,00 руб.», а у части товаров вместо цены стоит «по запросу». Посчитать по такому прайсу ничего нельзя.'
goal: Сделайте заголовки, уберите « руб.» из цены, задайте типы (Товар и Категория — текст, Цена — десятичное число) и удалите строки, где цена не превратилась в число.
answer:
- {op: promote}
- op: replace
  cols: [Цена]
  find: ' руб.'
  repl: ''
- op: type
  cols: {Товар: text, Категория: text, Цена: number}
- op: removeErrors
  cols: [Цена]
hint: После смены типа в строках «по запросу» появится Error. Выделите «Цена» и выберите «Удалить строки» → «Удалить ошибки».
explanation: Пробелы между разрядами и запятая в дроби Power Query с русскими региональными настройками понимает сам. Мешает только приписка «руб.» — её убирают заменой.
tip: 'Перед удалением ошибок щёлкните по ячейке Error: внизу видно, какое значение не превратилось в число. Иногда это опечатка, которую лучше исправить, чем выбросить.'
