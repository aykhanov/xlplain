title: Выделить НДС из суммы
seo_title: 'Power Query: настраиваемый столбец с формулой M — тренажёр'
check: pq
source: orders
story: Суммы заказов указаны с НДС 22 %. Бухгалтерии нужен отдельный столбец с НДС, округлённым до копеек.
goal: Добавьте столбец «НДС» с формулой Number.Round([Сумма] * 22 / 122, 2) и типом «Десятичное число».
answer:
- {op: addCol, name: НДС, expr: 'Number.Round([Сумма] * 22 / 122, 2)', type: number}
hint: «Добавить столбец» → «Настраиваемый столбец». Имя — НДС, формула — Number.Round([Сумма] * 22 / 122, 2). Столбцы можно вставлять двойным щелчком из списка справа.
explanation: 'Формулы в M пишутся с учётом регистра: Number.Round, а не number.round. Аргументы разделяются запятой, дробная часть — точкой.'
tip: 'Number.Round по умолчанию округляет по-банковски: 2,5 превращается в 2. Для привычного округления добавьте третий аргумент RoundingMode.AwayFromZero.'
