title: Клиент и город в одной строке
seo_title: 'Power Query: склеить текст из столбцов оператором & — тренажёр'
check: pq
source: orders
story: Для подписей на диаграмме нужен столбец вида «Смирнова Мария (Москва)».
goal: 'Добавьте столбец «Клиент и город» с текстом: клиент, пробел, город в скобках. Тип — текст.'
answer:
- {op: addCol, name: Клиент и город, expr: '[Клиент] & " (" & [Город] & ")"', type: text}
hint: 'Текст склеивается оператором &: [Клиент] & " (" & [Город] & ")".'
explanation: 'В M оператор & склеивает только текст. Если нужно приклеить число, сначала превратите его в текст: Text.From([Сумма]).'
tip: 'Альтернатива — Text.Combine({[Клиент], [Город]}, ", "): она сама пропускает пустые значения.'
