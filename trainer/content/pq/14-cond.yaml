id: pq-cond
slug: power-query-uslovnyy-stolbec
module: pq
track: 3
order: 14
title: Крупные и обычные заказы
seo_title: 'Power Query: условный столбец — тренажёр'
check: pq
source: orders
story: Отдел продаж делит заказы на крупные — от 10 000 ₽ — и обычные. Нужна метка в каждой строке.
goal: 'Добавьте условный столбец «Размер заказа»: если Сумма больше или равна 10000, то «Крупный», иначе «Обычный».'
answer:
- op: condCol
  name: Размер заказа
  rules:
  - {col: Сумма, op: ge, value: '10000', out: Крупный}
  else: Обычный
hint: «Добавить столбец» → «Условный столбец». Столбец — Сумма, оператор — «больше или равно», значение 10000, вывод «Крупный», иначе — «Обычный».
explanation: Условный столбец — это та же формула if … then … else, только собранная мышью. Откройте расширенный редактор, чтобы увидеть код M.
tip: Условия проверяются сверху вниз до первого совпадения, поэтому в цепочке «больше» ставьте сначала самый большой порог.
