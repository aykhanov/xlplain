id: pq-abc
slug: power-query-uslovnyy-stolbec-neskolko-usloviy
module: pq
track: 3
order: 15
title: ABC-метка заказа
seo_title: 'Power Query: условный столбец с несколькими условиями — тренажёр'
check: pq
source: orders
story: 'Для ABC-анализа заказы делят на три группы: A — от 15 000 ₽, B — от 7 000 ₽, C — остальные.'
goal: 'Добавьте условный столбец «Группа»: Сумма ≥ 15000 → «A», иначе если Сумма ≥ 7000 → «B», иначе «C».'
answer:
- op: condCol
  name: Группа
  rules:
  - {col: Сумма, op: ge, value: '15000', out: A}
  - {col: Сумма, op: ge, value: '7000', out: B}
  else: C
hint: 'В окне условного столбца нажмите «Добавить предложение» для второго условия. Порядок важен: сначала порог 15000, потом 7000.'
explanation: 'Если поставить 7000 первым, все заказы от 15 000 тоже попадут в B: условие сработает раньше.'
tip: 'Ту же логику можно написать в настраиваемом столбце: if [Сумма] >= 15000 then "A" else if [Сумма] >= 7000 then "B" else "C".'
