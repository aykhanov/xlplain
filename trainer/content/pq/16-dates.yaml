title: Год и месяц из даты
seo_title: 'Power Query: извлечь год и месяц из даты — тренажёр'
check: pq
source: orders
story: Для сводной по месяцам нужны отдельные столбцы с годом и номером месяца.
goal: 'Добавьте два новых столбца из «Даты»: «Год» и «Месяц» (номер месяца). Столбец «Дата» должен остаться.'
answer:
- {op: dateOp, col: Дата, mode: year, add: true}
- {op: dateOp, col: Дата, mode: month, add: true}
hint: Выделите «Дата», «Добавить столбец» → «Дата» → «Год», потом снова выделите «Дата» → «Дата» → «Месяц». На вкладке «Преобразование» эти команды заменили бы дату.
explanation: Команды из группы «Из даты и времени» на вкладке «Добавить столбец» создают новый столбец с понятным именем и правильным типом.
tip: 'Для группировки по месяцам удобнее «Начало месяца»: это настоящая дата, и в Power BI по ней строится нормальная временная ось.'
