id: pq-append
slug: power-query-dobavit-zaprosy
module: pq
track: 4
order: 17
title: Собрать три месяца в одну таблицу
seo_title: 'Power Query: добавить запросы (append) — тренажёр'
check: pq
source: salesJune
queries: {Продажи_июль: salesJuly, Продажи_август: salesAug}
query_name: Продажи_июнь
story: Продажи приходят отдельными файлами за каждый месяц с одинаковыми столбцами. Нужна общая таблица за лето.
goal: К запросу «Продажи_июнь» добавьте запросы «Продажи_июль» и «Продажи_август».
answer:
- op: append
  queries: [Продажи_июль, Продажи_август]
hint: «Главная» → «Добавить запросы». Отметьте обе таблицы. Готовые запросы можно посмотреть в панели «Запросы» слева.
explanation: Добавление ставит строки одной таблицы под другой и сопоставляет столбцы по именам. Если имя где-то отличается, получится лишний столбец с пустыми значениями.
tip: 'Когда файлов много, используйте источник «Папка»: Power Query сам объединит все файлы с одинаковой структурой, а новый месяц подтянется при обновлении.'
