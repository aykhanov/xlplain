id: pq-merge
slug: power-query-obedinit-zaprosy-vpr
module: pq
track: 4
order: 18
title: Подтянуть товар и цену (как ВПР)
seo_title: 'Power Query: объединить запросы вместо ВПР — тренажёр'
check: pq
source: lines
queries: {Товары: products}
query_name: Строки_заказов
story: В строках заказов есть только код товара. Название и цена лежат в справочнике «Товары». В Excel тут писали бы ВПР.
goal: Объедините «Строки_заказов» с «Товарами» по «Коду товара» (внешнее соединение слева) и разверните столбцы Товар и Цена без префикса.
answer:
- op: merge
  with: Товары
  left: [Код товара]
  right: [Код товара]
  kind: leftouter
  as: Товары
- op: expand
  col: Товары
  fields: [Товар, Цена]
  names: [Товар, Цена]
hint: '«Главная» → «Объединить запросы». Слева столбец «Код товара», вторая таблица «Товары», справа тоже «Код товара». Потом кнопка ⇔ в заголовке нового столбца: отметьте Товар и Цена и снимите флажок префикса.'
explanation: 'Внешнее соединение слева сохраняет все строки заказов, даже если товара нет в справочнике: у них будет null. Это честнее ВПР, который вернул бы #Н/Д.'
tip: Если ключ в одной таблице текст, а в другой число, совпадений не будет. Окно слияния подсказывает это строкой «Выбор соответствует N строк».
