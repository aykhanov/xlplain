id: pq-merge-sum
slug: power-query-sliyanie-i-summa-stroki
module: pq
track: 4
order: 19
title: Сумма строки после слияния
seo_title: 'Power Query: слияние и настраиваемый столбец — тренажёр'
check: pq
source: lines
queries: {Товары: products}
query_name: Строки_заказов
story: 'Продолжение задачи с ВПР: после того как цена подтянулась, нужна сумма каждой строки заказа.'
goal: Объедините «Строки_заказов» с «Товарами» по «Коду товара» (слева), разверните только «Цена» без префикса и добавьте столбец «Сумма» = Количество × Цена с типом «Десятичное число».
answer:
- op: merge
  with: Товары
  left: [Код товара]
  right: [Код товара]
  kind: leftouter
  as: Товары
- op: expand
  col: Товары
  fields: [Цена]
  names: [Цена]
- {op: addCol, name: Сумма, expr: '[Количество] * [Цена]', type: number}
hint: После разворота добавьте настраиваемый столбец с формулой [Количество] * [Цена].
explanation: 'Для строки, где товара нет в справочнике, цена null, и сумма тоже будет null: в M любое действие с null даёт null, а не ошибку.'
tip: 'Цену из справочника лучше подтягивать в Power Query, а не хранить в каждой строке продаж: тогда исправление цены в одном месте попадёт во все отчёты.'
