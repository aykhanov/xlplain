id: pq-merge-clients
slug: power-query-sliyanie-spravochnik-klientov
module: pq
track: 4
order: 20
title: Город клиента вместо кода
seo_title: 'Power Query: подтянуть данные из справочника — тренажёр'
check: pq
source: ordersCodes
queries: {Клиенты: clients}
query_name: Заказы
story: В заказах только код клиента. Для отчёта по городам нужны имя клиента и город из справочника «Клиенты», а код больше не нужен.
goal: Объедините «Заказы» с «Клиентами» по «Коду клиента» (слева), разверните Клиент и Город без префикса и удалите столбец «Код клиента».
answer:
- op: merge
  with: Клиенты
  left: [Код клиента]
  right: [Код клиента]
  kind: leftouter
  as: Клиенты
- op: expand
  col: Клиенты
  fields: [Клиент, Город]
  names: [Клиент, Город]
- op: removeCols
  cols: [Код клиента]
hint: Слияние → разворот (⇔) → выделить «Код клиента» → «Удалить столбцы».
explanation: 'Удалять ключ лучше после разворота: пока слияние не выполнено, он нужен для поиска.'
tip: 'В Power BI так делать не обязательно: там справочник и факт связывают в модели. Слияние в Power Query нужно, когда результат идёт в плоскую таблицу Excel.'
