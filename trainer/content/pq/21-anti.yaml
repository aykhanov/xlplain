id: pq-anti
slug: power-query-anti-soedinenie-neoplachennye
module: pq
track: 4
order: 21
title: Найти неоплаченные счета
seo_title: 'Power Query: анти-соединение для сверки — тренажёр'
check: pq
source: invoices
queries: {Оплаты: payments}
query_name: Счета
story: Есть реестр выставленных счетов и выгрузка оплат из банка. Нужен список счетов, по которым денег ещё нет.
goal: Объедините «Счета» с «Оплатами» по «Номеру счёта» с типом «Анти-соединение слева» и удалите получившийся столбец «Оплаты».
answer:
- op: merge
  with: Оплаты
  left: [Номер счёта]
  right: [Номер счёта]
  kind: leftanti
  as: Оплаты
- op: removeCols
  cols: [Оплаты]
hint: В окне слияния выберите тип соединения «Анти-соединение слева (строки только в первой)». Столбец с вложенными таблицами будет пустым — удалите его.
explanation: 'Анти-соединение оставляет строки первой таблицы, для которых во второй нет пары. Это сверка в один шаг, без ВПР и фильтра по #Н/Д.'
tip: 'Анти-соединение справа покажет обратное: оплаты, для которых нет счёта в реестре. Полезно, когда клиент ошибся в номере.'
