id: pq-unpivot
slug: power-query-unpivot-mesyacy
module: pq
track: 5
order: 22
title: Развернуть месяцы в строки
seo_title: 'Power Query: отменить свёртывание столбцов (unpivot) — тренажёр'
check: pq
source: plan
story: 'План продаж сделан «в ширину»: менеджеры по строкам, месяцы по столбцам. Для Power BI нужна длинная таблица.'
goal: 'Получите три столбца: Менеджер (текст), Месяц (текст), План (десятичное число). Пустые ячейки плана в результат не попадают.'
answer:
- {op: promote}
- op: unpivotOther
  cols: [Менеджер]
- {op: rename, col: Атрибут, to: Месяц}
- {op: rename, col: Значение, to: План}
- op: type
  cols: {Менеджер: text, Месяц: text, План: number}
hint: Повысьте заголовки, выделите «Менеджер» и выберите «Отменить свертывание других столбцов». Потом переименуйте «Атрибут» и «Значение» и задайте типы.
explanation: «Отменить свертывание других столбцов» запоминает, какой столбец оставить, а не какие развернуть. Когда в файле появится новый месяц, запрос подхватит его без правок.
tip: Пустые ячейки при развороте пропадают сами. Если нулевой план важен, сначала замените null на 0.
