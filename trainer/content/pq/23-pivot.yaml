title: Месяцы по столбцам (pivot)
seo_title: 'Power Query: столбец сведения (pivot) — тренажёр'
check: pq
source: salesLong
story: 'Обратная задача: продажи лежат длинной таблицей «Менеджер — Месяц — Сумма», по строке на заказ. Руководитель хочет таблицу, где менеджеры по строкам, а месяцы по столбцам.'
goal: Сделайте сведение по столбцу «Месяц» со значениями из «Суммы» и агрегированием «Сумма».
answer:
- {op: pivot, col: Месяц, val: Сумма, agg: sum}
hint: Выделите «Месяц», «Преобразование» → «Столбец сведения». Столбец значений — Сумма, функция агрегирования — Сумма.
explanation: На одного менеджера и месяц приходится несколько заказов, поэтому без агрегирования сведение даст ошибку «Слишком много элементов».
tip: 'Сведённую таблицу удобно отдавать людям, но для дальнейших расчётов и Power BI храните длинную: её проще фильтровать и группировать.'
