title: Выручка и заказы по городам
seo_title: 'Power Query: группировать по с несколькими агрегатами — тренажёр'
check: pq
source: orders
story: 'Нужна короткая таблица для письма: по каждому городу выручка и число заказов.'
goal: 'Сгруппируйте по «Городу» с двумя столбцами: «Выручка» — сумма «Суммы», «Заказы» — число строк.'
answer:
- op: group
  by: [Город]
  aggs:
  - {name: Выручка, op: sum, col: Сумма}
  - {name: Заказы, op: count}
hint: «Преобразование» → «Группировать по». Добавьте второе агрегирование кнопкой «Добавить агрегирование».
explanation: 'Группировка в Power Query уменьшает таблицу ещё до загрузки в Excel: файл легче, а сводная не нужна.'
tip: Агрегат «Все строки» в настоящем Power Query сохраняет вложенную таблицу для каждой группы. С ней делают, например, нумерацию внутри группы.
