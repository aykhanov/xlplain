module: pq
track: 5
order: 25
title: Остатки по категориям
seo_title: 'Power Query: заполнить вниз и группировать — тренажёр'
check: pq
source: stock
story: 'Отчёт об остатках из 1С: категория указана только в первой строке группы, суммы записаны текстом. Нужен итог по категориям.'
goal: 'Получите два столбца: Категория (текст) и Сумма (десятичное число) — сумма остатков по категории.'
answer:
- {op: promote}
- op: fillDown
  cols: [Категория]
- op: type
  cols: {Категория: text, Сумма: number}
- op: group
  by: [Категория]
  aggs:
  - {name: Сумма, op: sum, col: Сумма}
hint: Заголовки → «Заполнить вниз» по «Категории» → тип «Суммы» десятичное число → «Группировать по» Категории с операцией «Сумма».
explanation: 'Без заполнения вниз строки с пустой категорией сгруппировались бы в отдельную группу null. А без смены типа суммы не сложатся: текст не складывается.'
tip: 'Проверьте итог группировки против итога в 1С: если не сошлось, ищите строки с ошибками в «Сумме».'
