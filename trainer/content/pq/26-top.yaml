id: pq-top
slug: power-query-top-klientov
module: pq
track: 5
order: 26
title: Топ-5 клиентов по выручке
seo_title: 'Power Query: группировка, сортировка и первые строки — тренажёр'
check: pq
source: orders
story: Для ежемесячной рассылки нужны пять клиентов с наибольшей выручкой.
goal: Сгруппируйте по «Клиенту» с суммой «Суммы» в столбце «Выручка», отсортируйте по убыванию выручки и оставьте первые 5 строк.
answer:
- op: group
  by: [Клиент]
  aggs:
  - {name: Выручка, op: sum, col: Сумма}
- op: sort
  by:
  - {col: Выручка, desc: true}
- {op: keepTop, n: 5}
hint: Группировка → сортировка по убыванию (меню ▾ в заголовке «Выручки») → «Главная» → «Сохранить строки» → «Сохранить верхние строки», 5.
explanation: Без сортировки «Сохранить верхние строки» взял бы первых пятерых по алфавиту или по порядку в источнике.
tip: 'Этот запрос можно сделать параметром: вместо числа 5 подставить параметр «Сколько клиентов», и менять его без открытия редактора.'
