id: pq-folder
slug: power-query-obedinit-fayly-iz-papki
module: pq
track: 6
order: 27
title: Собрать все файлы из папки
seo_title: 'Power Query: источник «Папка» и объединение файлов — тренажёр'
check: pq
source: folder
story: Каждый месяц бухгалтерия кладёт выгрузку продаж в одну папку. Вместо ручного копирования нужна одна таблица, которая сама подхватит новый файл. В папке завалялся ещё текстовый файл с пояснением.
goal: 'Оставьте в списке только файлы .xlsx, объедините их и задайте типы: Дата — дата, Номер заказа — целое число, Клиент — текст, Сумма — десятичное число.'
answer:
- op: filter
  col: Extension
  keep: [.xlsx]
- {op: combineFiles}
- op: type
  cols: {Дата: date, Номер заказа: int, Клиент: text, Сумма: number}
hint: 'Сначала фильтр ▾ по столбцу Extension: снимите флажок с .txt. Потом кнопка ⇓⇓ в заголовке Content — «Объединить файлы».'
explanation: Объединение строит запрос по примеру первого файла и применяет его ко всем остальным. Файл другого формата ломает весь запрос, поэтому лишнее отсекают фильтром до объединения.
tip: 'Фильтр по расширению оставьте в запросе навсегда: кто-нибудь обязательно положит в папку скриншот или временный файл ~$Продажи.xlsx.'
