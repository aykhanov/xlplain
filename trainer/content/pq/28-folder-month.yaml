id: pq-folder-month
slug: power-query-imya-fayla-v-stolbec
module: pq
track: 6
order: 28
title: Месяц из имени файла
seo_title: 'Power Query: имя файла как столбец после объединения — тренажёр'
check: pq
source: folder
story: После объединения файлов у каждой строки есть столбец Source.Name с именем файла, например «Продажи_июль.xlsx». Из него можно получить месяц.
goal: 'Отфильтруйте .xlsx, объедините файлы, превратите Source.Name в месяц («июль») и переименуйте столбец в «Месяц». Остальным столбцам задайте типы: Дата — дата, Номер заказа — целое число, Клиент — текст, Сумма — десятичное число.'
answer:
- op: filter
  col: Extension
  keep: [.xlsx]
- {op: combineFiles}
- {op: extract, col: Source.Name, mode: between, delim: _, delim2: .}
- {op: rename, col: Source.Name, to: Месяц}
- op: type
  cols: {Дата: date, Номер заказа: int, Клиент: text, Сумма: number}
hint: 'Выделите Source.Name и выберите «Преобразование» → «Извлечь» → «Текст между разделителями»: начальный «_», конечный «.». Можно и двумя заменами: «Продажи_» и «.xlsx» на пустоту.'
explanation: Имя файла — часто единственное место, где записан период выгрузки. Если оставить его в данных, не придётся добавлять месяц в каждый файл руками.
tip: 'Договоритесь об именах файлов заранее: «Продажи_2026-07.xlsx» потом легко превращается в настоящую дату через Date.From.'
