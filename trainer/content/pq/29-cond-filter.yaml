id: pq-cond-filter
slug: power-query-chislovoy-filtr
module: pq
track: 6
order: 29
title: 'Фильтр по условию: крупные заказы Москвы'
seo_title: 'Power Query: числовой фильтр и фильтр по значениям — тренажёр'
check: pq
source: orders
story: 'Для разбора с отделом продаж нужны только крупные московские заказы: сумма больше 10 000 ₽.'
goal: Оставьте заказы, где Сумма больше 10000 и Город — Москва.
answer:
- {op: selectRows, expr: '[Сумма] > 10000'}
- op: filter
  col: Город
  keep: [Москва]
hint: 'В меню ▾ столбца «Сумма» выберите «Числовые фильтры…» → «больше» 10000. Город отфильтруйте флажками. Можно и одной формулой: = Table.SelectRows(Источник, each [Сумма] > 10000 and [Город] = "Москва").'
explanation: 'Фильтр по значениям запоминает конкретные значения, а числовой фильтр — условие. Для порогов всегда используйте условие: новые заказы попадут в отбор сами.'
tip: 'Щёлкните по строке формул над таблицей: условие фильтра можно поправить прямо там, например заменить 10000 на 15000, не открывая меню.'
