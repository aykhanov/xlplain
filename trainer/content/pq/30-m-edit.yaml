id: pq-m-edit
slug: power-query-rasshirennyy-redaktor-kod-m
module: pq
track: 6
order: 30
title: Поправить запрос в расширенном редакторе
seo_title: 'Power Query: правка кода M в расширенном редакторе — тренажёр'
check: pq
source: orders
starter:
- {op: selectRows, expr: '[Город] = "Москва"'}
- op: group
  by: [Менеджер]
  aggs:
  - {name: Выручка, op: sum, col: Сумма}
- op: sort
  by:
  - {col: Выручка, desc: true}
story: 'Коллега собрал запрос: выручка менеджеров по Москве. Теперь руководителю нужны Москва и Казань вместе. Шаги уже есть, их не нужно собирать заново.'
goal: Откройте «Расширенный редактор» и измените условие фильтра так, чтобы в отбор попали заказы из Москвы и из Казани. Остальные шаги не трогайте.
answer:
- {op: selectRows, expr: '[Город] = "Москва" or [Город] = "Казань"'}
- op: group
  by: [Менеджер]
  aggs:
  - {name: Выручка, op: sum, col: Сумма}
- op: sort
  by:
  - {col: Выручка, desc: true}
hint: 'В строке с Table.SelectRows допишите: each [Город] = "Москва" or [Город] = "Казань". Условия в M соединяются словами and и or, текст пишется в двойных кавычках.'
explanation: 'Расширенный редактор показывает весь запрос как цепочку шагов: каждый следующий ссылается на предыдущий по имени. Правка одного условия не ломает остальное.'
tip: 'Если условие длинное, используйте список: each List.Contains({"Москва", "Казань"}, [Город]) — в настоящем Power Query так удобнее добавлять города.'
