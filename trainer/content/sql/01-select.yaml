id: select
slug: select-vybrat-stolbcy
module: sql
track: 1
order: 1
fn: SELECT
title: Список клиентов
seo_title: "SELECT в SQL: выбрать нужные столбцы — задача с решением"
story: Менеджеру нужен короткий список клиентов для обзвона, без лишних столбцов.
goal: Выведите имя и город каждого клиента из таблицы clients
starter: SELECT * FROM clients;
answer: SELECT name, city FROM clients;
order_matters: false
hint: После SELECT перечисляются нужные столбцы через запятую, после FROM — таблица. Звёздочка * означает «все столбцы».
excel: В Excel вы бы скрыли лишние столбцы или скопировали два нужных на новый лист. В SQL просто перечисляете их после SELECT.
tip: В рабочих запросах лучше перечислять столбцы явно, а не писать *. Если в таблицу добавят новый столбец, отчёт не «поедет».
