id: like
slug: like-poisk-po-nachalu-teksta
module: sql
track: 1
order: 4
fn: LIKE
title: Весь чай из каталога
seo_title: "LIKE в SQL: поиск по началу строки — задача с решением"
story: Покупатель спрашивает, какой чай есть в наличии. Название каждого чая начинается со слова «Чай».
goal: Выведите названия товаров, которые начинаются на «Чай»
starter: SELECT name FROM products;
answer: SELECT name FROM products WHERE name LIKE 'Чай%';
order_matters: false
hint: "LIKE сравнивает с шаблоном: знак % заменяет любое количество символов. 'Чай%' — всё, что начинается на «Чай»."
excel: "В Excel это текстовый фильтр «начинается с» или критерий \"Чай*\" в СЧЁТЕСЛИ."
tip: "'%кофе%' найдёт слово в любом месте строки. Учтите: в SQLite LIKE не различает регистр только для латиницы, поэтому кириллицу пишите так же, как в данных."
